    commDiv.addEventListener('mouseleave', () => {
      commDiv.style.background = 'rgba(255,255,255,0.05)';

      if (e.target.classList.contains('member-item')) return;

      if (membersDiv.style.display === 'none') {
        const nodes = network.body.data.nodes.get();

          .filter(n => n.community === `#${comm.id}`)
          .sort((a, b) => (b.size || 0) - (a.size || 0));

          const memberItem = document.createElement('div');

  `;

  document.body.appendChild(playerCounter);

  // === УПРАВЛЕНИЕ ВИДИМОСТЬЮ СВЯЗЕЙ ===
  function hideAllEdges() {
    const edges = network.body.data.edges.get();
    const updates = edges.map(e => {
      if (!originalEdgeColors[e.id]) {
        originalEdgeColors[e.id] = e.color;
      }
      return {
        id: e.id,
        color: e.color.replace(/rgba\((\d+),\s*(\d+),\s*(\d+),\s*[\d.]+\)/, 'rgba($1,$2,$3,0)')
      };
    });
    network.body.data.edges.update(updates);
  }

  function showNodeEdges(nodeId) {
    const edges = network.body.data.edges.get();
    const connectedEdges = edges.filter(e => 
      String(e.from) === String(nodeId) || String(e.to) === String(nodeId)
    );

    const updates = connectedEdges.map(e => {
      let newColor;

      if (e.manual) {
        newColor = 'rgba(255, 60, 60, 0.85)';
      } else if (e.title && e.title.includes('NORM:')) {
        const normMatch = e.title.match(/NORM:([\d.]+)/);
        const normWeight = normMatch ? parseFloat(normMatch[1]) : 0;

        if (normWeight > 0.7) {
          newColor = 'rgba(100, 230, 100, 0.7)';
        } else if (normWeight > 0.4) {
          newColor = 'rgba(200, 200, 100, 0.5)';
        } else {
          newColor = 'rgba(180, 180, 180, 0.35)';
        }
      } else {
        newColor = 'rgba(180, 180, 180, 0.35)';
      }

      return {
        id: e.id,
        color: newColor
      };
    });

    network.body.data.edges.update(updates);
  }

function renderTopPlayers() {

            border-radius:4px;
            cursor:pointer;
            font-size:11px;
            transition:background 0.2s;
          ">24ч</button>

            padding:4px 8px;

          <th style="padding:6px 4px; color:#888; text-align:left;">Игрок</th>
          <th style="padding:6px 0; color:#888; text-align:center;">Игр</th>

        </tr>
      `;
    });

    topHtml += '</tbody></table>';
    weeklyTop.innerHTML = topHtml;
  }

  const ratingTable = document.createElement('div');

  const PAGE_SIZE = 30;

  const eloTotalPages = Math.ceil(eloLeaderboardData.length / PAGE_SIZE);

  function buildRatingTable() {
    if (!eloLeaderboardData || eloLeaderboardData.length === 0) {
      return `<h4 style="margin:0 0 10px 0; color:#4dabf7; font-size:14px;">🏆 Рейтинговая таблица</h4><p style="color:#888; font-size:12px; margin:0;">Нет данных</p>`;
    }
    const medals = ['🥇', '🥈', '🥉'];
    const start = eloPage * PAGE_SIZE;
    const pageData = eloLeaderboardData.slice(start, start + PAGE_SIZE);
    let rows = '';
    pageData.forEach((p, i) => {
      const absIdx = start + i;
      const medal = absIdx < 3 ? medals[absIdx] : `<span style="color:#666;font-size:11px;">#${p.rank}</span>`;
      const eloColor = p.elo >= 1200 ? '#FFD700' : p.elo >= 1100 ? '#4dabf7' : p.elo >= 1000 ? '#52BE80' : '#aaa';
      rows += `<div style="display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:12px;">
        <span style="width:22px;text-align:center;flex-shrink:0;">${medal}</span>
        <span style="flex:1;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${p.name}">${p.name}</span>
        <span style="color:${eloColor};font-weight:bold;flex-shrink:0;">${p.elo}</span>
        <span style="color:#666;font-size:11px;flex-shrink:0;">${p.wr}%</span>
      </div>`;
    });

    const pagination = eloTotalPages > 1 ? `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
        <button id="eloPrev" onclick="eloChangePage(-1)" style="background:rgba(77,171,247,0.15);border:1px solid rgba(77,171,247,0.3);color:#4dabf7;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;" ${eloPage === 0 ? 'disabled style="opacity:0.3;cursor:default;background:rgba(77,171,247,0.15);border:1px solid rgba(77,171,247,0.3);color:#4dabf7;border-radius:6px;padding:4px 10px;font-size:12px;"' : ''}>‹</button>
        <span style="color:#666;font-size:11px;">${eloPage + 1} / ${eloTotalPages}</span>
        <button id="eloNext" onclick="eloChangePage(1)" style="background:rgba(77,171,247,0.15);border:1px solid rgba(77,171,247,0.3);color:#4dabf7;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px;" ${eloPage === eloTotalPages - 1 ? 'disabled style="opacity:0.3;cursor:default;background:rgba(77,171,247,0.15);border:1px solid rgba(77,171,247,0.3);color:#4dabf7;border-radius:6px;padding:4px 10px;font-size:12px;"' : ''}>›</button>
      </div>` : '';

    return `<h4 style="margin:0 0 8px 0; color:#4dabf7; font-size:14px;">🏆 Рейтинговая таблица</h4>

      <div id="eloRows">${rows}</div>
      ${pagination}`;
  }

  window.eloChangePage = function(dir) {
    const newPage = eloPage + dir;
    if (newPage < 0 || newPage >= eloTotalPages) return;
    eloPage = newPage;
    ratingTable.innerHTML = buildRatingTable();
    ratingTable.scrollTop = 0;

  const dropdown = document.createElement('div');

    position: 'absolute',

    const query = e.target.value.toLowerCase().trim();
    clearTimeout(searchTimeout);

    }

    searchTimeout = setTimeout(() => {
      const nodes = network.body.data.nodes.get();
      const matches = nodes
        .filter(n => n.label && n.label.toLowerCase().includes(query))
        .slice(0, 10);

      if (matches.length === 0) {
        dropdown.innerHTML = '<div style="padding:10px;color:#888;">Ничего не найдено</div>';
        dropdown.style.display = 'block';
        return;
      }

      dropdown.innerHTML = '';
      matches.forEach(node => {
        const item = document.createElement('div');
        Object.assign(item.style, {
          padding: '10px 15px',
          cursor: 'pointer',
          borderBottom: '1px solid rgba(255,255,255,0.1)',
          transition: 'background 0.2s',
          color: '#ffffff'
        });
        item.textContent = node.label;

        item.addEventListener('mouseenter', () => {
          item.style.background = 'rgba(77,171,247,0.2)';
        });
        item.addEventListener('mouseleave', () => {
          item.style.background = 'transparent';
        });

        item.addEventListener('click', () => {
          searchBox.value = node.label;
          dropdown.style.display = 'none';
          network.selectNodes([node.id]);
          handleNodeClick(node.id);
        });

        dropdown.appendChild(item);
      });

      dropdown.style.display = 'block';
    }, 300);
  });

  document.addEventListener('click', (e) => {
    if (!searchContainer.contains(e.target)) {
      dropdown.style.display = 'none';
    }
  });

  // === ОБРАБОТЧИК КЛИКА ===
  function handleNodeClick(nodeId) {
    if (isProcessingClick) return;
    isProcessingClick = true;

    const edges = network.body.data.edges;
    const nodes = network.body.data.nodes;
    const node = nodes.get(nodeId);

    if (!node) return;

    const playerName = node.label || nodeId;

    if (selectedNodeId === nodeId) {
      hideAllEdges();
      hideInfo();
      selectedNodeId = null;
      network.unselectAll();

      setTimeout(() => {
        isProcessingClick = false;
      }, 100);
      return;
    }

    hideAllEdges();
    showNodeEdges(nodeId);
    selectedNodeId = nodeId;

    const allEdges = edges.get();
    const connected = allEdges.filter(e =>
      String(e.from) === String(nodeId) || String(e.to) === String(nodeId)
    );

    const connections = connected
      .filter(e => e.games && !e.manual)
      .map(e => {
        const otherId = String(e.from) === String(nodeId) ? e.to : e.from;
        const other = nodes.get(otherId);
        return [other ? other.label : otherId, e.games];
      })
      .sort((a, b) => b[1] - a[1]);

    showInfo(playerName, connections);

    setTimeout(() => {
      isProcessingClick = false;
    }, 100);
  }

  network.on("click", function(params) {
    if (params.nodes.length) {
      handleNodeClick(params.nodes[0]);
    } else {
      hideAllEdges();
      hideInfo();
      selectedNodeId = null;
    }
  });

  network.on("selectNode", function(params) {
    if (params.nodes.length) {
      handleNodeClick(params.nodes[0]);
    }
  });

  // === ЛОАДЕР ===
  const loader = document.createElement('div');
  Object.assign(loader.style, {
    position: 'fixed',
    top: '50%',
    left: '50%',
    transform: 'translate(-50%, -50%)',
    color: '#fff',
    fontSize: '20px',
    zIndex: '100000',
    background: 'rgba(30,30,30,0.9)',
    padding: '20px 40px',
    borderRadius: '12px',
    boxShadow: '0 8px 32px rgba(0,0,0,0.8)'
  });
  loader.innerHTML = '⏳ Загрузка графа...';
  document.body.appendChild(loader);

  network.once('stabilizationIterationsDone', () => {
    loader.style.display = 'none';
  });

  console.log("✅ График с сообществами готов!");
})();
</script>
